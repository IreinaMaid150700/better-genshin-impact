# Fine-tune latin_PP-OCRv5_mobile_rec cho tiếng Việt (BetterGI).
# Dựa trên configs/rec/PP-OCRv5/multi_language/latin_PP-OCRv5_mobile_rec.yml của PaddleOCR;
# đường dẫn theo bố cục notebook kaggle_train.ipynb (/kaggle/working).
Global:
  model_name: latin_PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: /kaggle/working/output/vi_rec
  save_epoch_step: 2
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  # vi_init.pdparams: trọng số chính thức đã mở rộng head bằng expand_head.py
  pretrained_model: /kaggle/working/pretrain/vi_init
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: /kaggle/working/kit/vi_dict.txt
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /kaggle/working/output/vi_rec/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /kaggle/working/synth/
    ext_op_transform_idx: 1
    label_file_list:
    - /kaggle/working/synth/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.5
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: 25
    - RecAug:
    - MultiLabelEncode:
        max_text_length: 25
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    # Kaggle T4 (15 GB): 128 bị hết VRAM; notebook chạy 2 GPU nên tổng batch vẫn 128
    first_bs: &bs 64
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /kaggle/working/synth/
    label_file_list:
    - /kaggle/working/synth/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        max_text_length: 1000
        gtc_encode: NRTRLabelEncode
    # eval_mode: True giữ tỉ lệ ảnh -> chiều rộng khác nhau, không gộp được batch 64;
    # False: resize + pad về 48x320 giống lúc train (đánh giá thật làm bằng OcrDataTool eval)
    - RecResizeImg:
        eval_mode: False
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
